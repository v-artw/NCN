[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-edge-scout"
version = "1.0.0"
description = "A-share research, demo/paper analysis, PMKF/MKF, AI review, and audit workbench"
requires-python = ">=3.12,<3.15"
dependencies = [
    "baostock>=0.8.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "PyYAML>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ashare_edge_scout = ["web_static/*.html", "web_static/*.css", "web_static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
